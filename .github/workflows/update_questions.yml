name: Auto update knowledge questions

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of new multiple-choice questions"
        required: false
        default: "12"

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate mixed knowledge questions and keyword puzzles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QUESTION_COUNT: ${{ inputs.count || '12' }}
        run: python scripts/generate_questions.py --count "$QUESTION_COUNT"

      - name: Validate question files
        run: python scripts/validate_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json history_vietnam.json general.json keyword_round.json
          git commit -m "Auto-update mixed knowledge questions"
          git push
